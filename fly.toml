# Fly.io config. Create the app once with `fly apps create <name>` and adjust `app` if the name is taken.
app = "paceproof"
primary_region = "fra"

[build]

[env]
  ENVIRONMENT = "production"
  HOST = "0.0.0.0"
  PORT = "8000"
  ALLOWED_HOSTS = "paceproof.fly.dev"
  BASE_URL = "https://paceproof.fly.dev"
  INVITE_ONLY = "true"

[http_service]
  internal_port = 8000
  force_https = true
  # The background worker will live in this process, so keep one machine running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"
    [http_service.checks.headers]
      Host = "paceproof.fly.dev"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
